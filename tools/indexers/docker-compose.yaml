# C-chain indexers feeding the reward calculator, one per network.
#
#   cp .env.example .env    # set the RPC URLs and pick the networks
#   docker compose up -d
#
# Networks are chosen with COMPOSE_PROFILES in .env (flare, songbird, coston,
# coston2),
# or ad hoc with --profile. Every indexer configuration is inline below, so
# .env is the only file to edit.
#
# One MySQL serves all networks and publishes its port, so the calculator can
# run off the box, as the read-only reader user. Each network has its own
# database, so -d is always needed:
#
#   ./fsp-rewards-calculator -n songbird -e 415 -h <box> \
#       -d fsp_indexer_songbird -u reader -w <DB_READER_PASSWORD>
name: fsp-indexers

x-indexer: &indexer
  image: ghcr.io/flare-foundation/flare-system-c-chain-indexer:v2.0.0-rc.4
  restart: unless-stopped
  # So a node running on this box can be given as http://host.docker.internal:9650
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    indexer-db:
      condition: service_healthy
  # /health turns 200 only once the initial backfill is done, which takes as
  # long as history_epochs is deep, so the start period is effectively unbounded.
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
    start_period: 8760h

x-db-env: &db-env
  DB_HOST: indexer-db
  DB_PORT: 3306
  DB_USERNAME: root
  DB_PASSWORD: root

configs:
  db-init:
    content: |
      CREATE DATABASE IF NOT EXISTS `fsp_indexer_flare`;
      CREATE DATABASE IF NOT EXISTS `fsp_indexer_songbird`;
      CREATE DATABASE IF NOT EXISTS `fsp_indexer_coston`;
      CREATE DATABASE IF NOT EXISTS `fsp_indexer_coston2`;
      -- root is created for the compose subnet only (MYSQL_ROOT_HOST below), so
      -- the indexers can use it. Traffic arriving through the published port
      -- from this host is NAT'd to the gateway address, which is inside that
      -- subnet, so lock that one address out; remote hosts keep their own
      -- source address and never match the subnet in the first place.
      CREATE USER IF NOT EXISTS 'root'@'172.28.0.1' ACCOUNT LOCK;
      -- What the calculator connects with from off the box.
      CREATE USER IF NOT EXISTS 'reader'@'%' IDENTIFIED BY '${DB_READER_PASSWORD:?set DB_READER_PASSWORD in .env}';
      GRANT SELECT ON `fsp\_indexer\_%`.* TO 'reader'@'%';

  # history_epochs is how many past reward epochs stay fully indexed, and so how
  # far back rewards can be calculated. The node must reach back further than
  # the indexer does: roughly (history_epochs + 3) x 3.5 days on flare and
  # songbird. A node that cannot is reported by name at startup.
  flare-config:
    content: |
      [indexer]
      mode = "fsp"
      history_epochs = ${FLARE_HISTORY_EPOCHS:-2}
      rpc_concurrency = ${FLARE_RPC_CONCURRENCY:-25}
      log_range = ${FLARE_LOG_RANGE:-1000}
      new_block_check_millis = 1000

      [logger]
      level = "INFO"
      console = true

  songbird-config:
    content: |
      [indexer]
      mode = "fsp"
      history_epochs = ${SONGBIRD_HISTORY_EPOCHS:-2}
      rpc_concurrency = ${SONGBIRD_RPC_CONCURRENCY:-25}
      log_range = ${SONGBIRD_LOG_RANGE:-1000}
      new_block_check_millis = 1000

      [logger]
      level = "INFO"
      console = true

  coston-config:
    content: |
      [indexer]
      mode = "fsp"
      history_epochs = ${COSTON_HISTORY_EPOCHS:-2}
      rpc_concurrency = ${COSTON_RPC_CONCURRENCY:-25}
      log_range = ${COSTON_LOG_RANGE:-1000}
      new_block_check_millis = 1000

      [logger]
      level = "INFO"
      console = true

  coston2-config:
    content: |
      [indexer]
      mode = "fsp"
      history_epochs = ${COSTON2_HISTORY_EPOCHS:-2}
      rpc_concurrency = ${COSTON2_RPC_CONCURRENCY:-25}
      log_range = ${COSTON2_LOG_RANGE:-1000}
      new_block_check_millis = 1000

      [logger]
      level = "INFO"
      console = true

# Pinned so the gateway address the init script locks out is known. Change it
# if 172.28.0.0/24 is already taken on the box.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  data:

services:
  indexer-db:
    image: mysql:9.5.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      # Only the compose subnet, so the indexers can use root while the
      # published port cannot. Change both this and the subnet below together.
      MYSQL_ROOT_HOST: 172.28.0.%
    ports:
      - "${DB_PUBLISHED_PORT:-3306}:3306"
    configs:
      - source: db-init
        target: /docker-entrypoint-initdb.d/init.sql
    volumes:
      - data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent", "--host", "localhost", "-proot"]
      start_period: 60s
      start_interval: 2s
      timeout: 20s
      retries: 10

  flare-indexer:
    <<: *indexer
    profiles: [flare]
    environment:
      <<: *db-env
      DB_DATABASE: fsp_indexer_flare
      NODE_URL: ${FLARE_RPC_URL}
      NODE_API_KEY: ${FLARE_RPC_API_KEY:-}
    configs:
      - source: flare-config
        target: /app/config.toml

  songbird-indexer:
    <<: *indexer
    profiles: [songbird]
    environment:
      <<: *db-env
      DB_DATABASE: fsp_indexer_songbird
      NODE_URL: ${SONGBIRD_RPC_URL}
      NODE_API_KEY: ${SONGBIRD_RPC_API_KEY:-}
    configs:
      - source: songbird-config
        target: /app/config.toml

  coston-indexer:
    <<: *indexer
    profiles: [coston]
    environment:
      <<: *db-env
      DB_DATABASE: fsp_indexer_coston
      NODE_URL: ${COSTON_RPC_URL}
      NODE_API_KEY: ${COSTON_RPC_API_KEY:-}
    configs:
      - source: coston-config
        target: /app/config.toml

  coston2-indexer:
    <<: *indexer
    profiles: [coston2]
    environment:
      <<: *db-env
      DB_DATABASE: fsp_indexer_coston2
      NODE_URL: ${COSTON2_RPC_URL}
      NODE_API_KEY: ${COSTON2_RPC_API_KEY:-}
    configs:
      - source: coston2-config
        target: /app/config.toml
