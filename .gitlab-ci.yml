stages:
  - build
  - test
  - report

workflow:
  rules:
    - if: '$CI_OPEN_MERGE_REQUESTS && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "webide")'
      when: never
    - when: always

variables:
  GOPATH: /go
  GOLANG_VERSION: "1.25.5"
  GOLINT_VERSION: "v2.7.0"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

services:
  - name: docker:dind
    command: [ "--tls=false" ]

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - ${GOPATH}/pkg/mod
    - ${GOPATH}/bin

include:
  - component: gitlab.com/flarenetwork/ci-components-private/ai-code-review@2
    inputs:
      job_name_suffix: "-mr"
      model_backend: "gemini"
      rules_condition: $CI_MERGE_REQUEST_IID != null && $GITLAB_USER_NAME != "SealBot" && $CI_MERGE_REQUEST_EVENT_TYPE != "merge_train"
      rules_when: always
  - component: gitlab.com/flarenetwork/ci-components-private/ai-code-review@2
    inputs:
      job_name_suffix: "-repo"
      model_backend: "gemini"
      tags: ["flarenetwork-lg-cpu"]
      rules_condition: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      rules_when: manual
      repo_review_mode: true

build:
  stage: build
  image: golang:${GOLANG_VERSION}
  needs: [ ]
  script:
    - go mod tidy
    - go mod download
    - go build -mod=readonly ./...

lint:
  stage: test
  needs: [build]
  image: golangci/golangci-lint:${GOLINT_VERSION}
  script:
    - "! gofmt -l . | grep -q ."
    - golangci-lint run --timeout 5m0s

test:
  stage: test
  image: golang:${GOLANG_VERSION}
  needs: [ build ]
  script:
    - go test ./... -v -coverprofile=coverage.out
    - go tool cover -func=coverage.out
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%$/'
  artifacts:
    paths:
      - coverage.out
